name: Build DataStudio

# Triggered by `pnpm deploy:datastudio`. Checks out the private booker-blitz repo,
# packages DataStudio for Windows, macOS and Linux on this (public) repo's free
# runners, attaches the installers to the datastudio-vX.Y.Z release here, publishes
# it and rebuilds manifest.json.
#
# Needs one secret: BOOKER_BLITZ_TOKEN, a fine-grained PAT with read-only Contents
# access to davidsmorais/booker-blitz. Everything else uses the built-in GITHUB_TOKEN.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "booker-blitz branch, tag or SHA to build"
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: datastudio-build
  cancel-in-progress: false

env:
  BOOKER_BLITZ_REPO: davidsmorais/booker-blitz

jobs:
  # Fails in seconds, not after 15+ minutes of packaging, if the token is wrong.
  # Also reads the version from the private repo and makes sure the draft release exists.
  preflight:
    name: Resolve version and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Check BOOKER_BLITZ_TOKEN is set
        env:
          TOKEN: ${{ secrets.BOOKER_BLITZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::BOOKER_BLITZ_TOKEN secret is not set (fine-grained PAT, Contents: read on $BOOKER_BLITZ_REPO)"
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.BOOKER_BLITZ_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.BOOKER_BLITZ_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Read version
        id: meta
        run: |
          VERSION=$(node -p "require('./datastudio/version.json').version.trim()")
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid version in datastudio/version.json: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=datastudio-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          node scripts/release/changelog.mjs datastudio "$VERSION" --notes > notes.md \
            || echo "- Maintenance release." > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --latest=false \
            --target "$GITHUB_SHA" --title "Booker Blitz Datastudio v$VERSION" \
            --notes-file notes.md

  package:
    name: Package (${{ matrix.os }})
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.BOOKER_BLITZ_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.BOOKER_BLITZ_TOKEN }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Package Datastudio 📦
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:datastudio ${{ matrix.target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datastudio-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/datastudio/*.exe
            release/datastudio/*.dmg
            release/datastudio/*.AppImage

  release:
    name: Publish release and manifest
    needs: [preflight, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/installers
          pattern: datastudio-*
          merge-multiple: true

      - name: Upload installers and publish 🚀
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/installers/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

      # A release published with GITHUB_TOKEN does not fire manifest.yml, so rebuild here.
      - name: Rebuild manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATASTUDIO_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          node scripts/build-manifest.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: rebuild manifest for $DATASTUDIO_RELEASE_TAG [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
